# Netlify deploy for FaceTime From Mars.
# The Next.js app lives in frontend/; the Python backend is replaced in
# production by the Netlify Functions in frontend/netlify/functions.
# In a root netlify.toml, publish and functions paths are relative to the repo root.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "frontend/netlify/functions"
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Same /api/* paths the frontend already calls.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/characters"
  to = "/.netlify/functions/characters"
  status = 200
  force = true

[[redirects]]
  from = "/api/intro"
  to = "/.netlify/functions/intro"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true
